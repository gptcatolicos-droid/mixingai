  <script>
    // Preserve old bilingual blog links while giving each language its own static URL.
    (function () {
      var url = new URL(window.location.href);
      if (/^\/(en\/)?blog(?:\/|$)/.test(url.pathname) && /^(en|es)$/.test(url.searchParams.get('lang') || '')) {
        var english = url.searchParams.get('lang') === 'en';
        url.pathname = (english ? '/en' : '') + url.pathname.replace(/^\/en(?=\/)/, '');
        url.searchParams.delete('lang');
        window.location.replace(url.pathname + url.search + url.hash);
      }
    })();
  </script>
